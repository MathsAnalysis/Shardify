plugins {
    id 'java'
    id 'maven-publish'
    id("com.gradleup.shadow") version "9.0.0-beta8"
}


def name = 'Shardify'
def artifactId = 'shardify-load'
def groupId = 'it.mathsanalysis.load'

group = 'it.mathsanalysis.load'
version = '1.0.0'


java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(23))
}

tasks.withType(Test).configureEach {
    jvmArgs += '--enable-preview'
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['--enable-preview']
    options.release = 23
}

repositories {
    mavenCentral()
}

dependencies {

    compileOnly 'io.micrometer:micrometer-core:1.12.0'
    compileOnly 'org.springframework.boot:spring-boot-starter:3.2.0'
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure:3.2.0'


    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'

    implementation 'org.testcontainers:postgresql:1.19.0'
    implementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    implementation 'org.testcontainers:junit-jupiter:1.19.0'

    implementation 'com.zaxxer:HikariCP:7.0.0'
    implementation 'net.sf.trove4j:trove4j:3.0.3'
    implementation 'it.unimi.dsi:fastutil-core:8.5.15'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.1'

}

tasks {
    compileJava {
        dependsOn clean
        options.encoding = 'UTF-8'
    }

    build {
        dependsOn shadowJar
        dependsOn publish
    }
}

shadowJar {
    archiveFileName = name + '-' + version + '.jar'
    minimize()
}

jar{
    archiveFileName = name + '-' + version + '.jar'
}


publishing {
    publications {
        maven(MavenPublication) {
            groupId = groupId
            artifactId = artifactId

            from components.java
        }
    }
}


